name: Build and release Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleRelease
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk captio.apk
          gh release create "build-${{ github.run_id }}-${{ github.run_attempt }}" captio.apk --target "$GITHUB_SHA" --title "Captio build ${{ github.run_number }}" --notes "Installable APK signed with the Android debug key. For production, configure a private release signing key."
